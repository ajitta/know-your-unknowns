name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly re-validation against the current Claude Code CLI, so the
    # "Tested with" claim goes stale loudly instead of silently.
    - cron: "0 3 * * 1"

permissions:
  contents: read

env:
  # Plugin root, relative to the repo root. The only place the plugin path
  # appears — everything else derives from it.
  PLUGIN_DIR: .

jobs:
  hook-tests:
    strategy:
      fail-fast: false
      matrix:
        # Hook scripts are exercised at script level only (no Claude Code
        # runtime), which is the part that is meaningful on Windows.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Print tool versions
        run: python --version
      - name: Run hook script tests
        run: python -m unittest discover -s ${{ env.PLUGIN_DIR }}/tests -v

  plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The npm package requires Node.js 22 or later.
          node-version: "22"
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Print tool versions
        run: |
          node --version
          claude --version
      - name: Validate marketplace manifest
        run: claude plugin validate . --strict
      - name: Validate plugin (plugin.json, hooks.json, skills, agents)
        # The marketplace form above never opens the plugin's hook, skill or
        # agent files; the plugin form does.
        run: claude plugin validate ${{ env.PLUGIN_DIR }}/.claude-plugin/plugin.json --strict
