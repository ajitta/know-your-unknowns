name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly re-validation against the current Claude Code CLI, so the
    # "Tested with" claim goes stale loudly instead of silently.
    - cron: "0 3 * * 1"

permissions:
  contents: read

env:
  # Plugin root, relative to the repo root. The only place the plugin path
  # appears — everything else derives from it.
  PLUGIN_DIR: plugins/unknowns

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check generated packages
        run: python tools/package.py --check
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          # The npm package requires Node.js 22 or later.
          node-version: "22"
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Print tool versions
        run: |
          node --version
          claude --version
      - name: Check generated packages
        run: python tools/package.py --check
      - name: Validate marketplace manifest
        run: claude plugin validate . --strict
      - name: Validate plugin (manifest, skills, agents)
        # The marketplace form above never opens the plugin's skill or
        # agent files; the plugin form does.
        run: claude plugin validate --strict ${{ env.PLUGIN_DIR }}
